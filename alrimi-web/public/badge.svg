<!--
  안드로이드 상태 표시줄의 배지. `public/sw.js` 가 알림마다 이것을 붙인다.

  **앱 아이콘(icon-192.png)을 여기 쓰면 안 된다.** 안드로이드는 배지에서 알파 채널만
  가져다 쓰고 색은 전부 버린 뒤, 불투명한 자리를 시스템 색으로 칠한다. 앱 아이콘은
  초록 배경으로 꽉 차 있어서(95% 불투명) 모양 없는 흰 덩어리가 된다.

  그래서 배경 없이 **선만 불투명**하다. 색(#fff)은 실제로 쓰이지 않지만, 배지를
  무시하고 그냥 그리는 곳에서도 보이도록 흰색으로 둔다.

  점 셋은 앱 아이콘과 같은 표기인데 여기서는 **셋 다 채운다.** 원본은 마지막 하나가
  빈 점(발송 전)이지만, 상태 표시줄 크기(24dp)로 줄면 그 구멍이 뭉개져 얼룩으로 읽힌다.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <g fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="22" width="68" height="60" rx="12"/>
    <path d="M14 40h68"/>
    <path d="M32 14v12M64 14v12"/>
  </g>
  <g fill="#fff">
    <circle cx="34" cy="61" r="5.5"/>
    <circle cx="48" cy="61" r="5.5"/>
    <circle cx="62" cy="61" r="5.5"/>
  </g>
</svg>
