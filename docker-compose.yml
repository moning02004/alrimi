# 프로젝트 전체를 개발 모드로 띄운다. **앞뒤 모두 저장하면 바로 반영된다** —
# 소스를 컨테이너에 물려주고 각자의 리로더가 다시 읽는다
# (프런트는 `next dev`, 백엔드는 `runserver` 의 StatReloader).
#
#   docker compose up --build     # db + api + web
#   open http://localhost:3000    # 웹 (API 는 :8000)
#
#   docker compose up -d db api   # 백엔드만. 프런트는 호스트에서 npm run dev
#
# 운영은 이 파일이 아니라 docker-compose.prod.yml 로 띄운다(git 에는 없다).
#
# API 설정은 `alrimi-api/.env.local` 에서 온다 — 없으면 뜨지 않으므로
# `alrimi-api/.env.example` 을 복사해서 만든다. db 계정은 아래 기본값을 쓰고,
# 바꾸려면 셸 환경변수나 이 파일 옆의 `.env` 로 덮는다.
#
# 포트가 이미 쓰이고 있으면(호스트의 npm run dev 등) WEB_PORT·API_PORT·DB_PORT 로
# 옮긴다. 예) WEB_PORT=3001 docker compose up
# 단 웹 포트를 옮기면 그 오리진을 alrimi-api/.env.local 의 CORS_ALLOWED_ORIGINS 에
# 넣어야 한다 — 브라우저가 다른 오리진으로 API 를 부르는 셈이 된다.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alrimi}
      POSTGRES_USER: ${POSTGRES_USER:-alrimi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alrimi-local}
    ports:
      # 호스트에서 psql 로 붙거나, API 만 venv 로 돌릴 때 쓴다
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # 준비되기 전에 migrate 가 붙으면 그냥 죽는다. $$ 는 compose 가 아니라
      # 컨테이너 셸이 풀도록 남겨두는 것이다.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./alrimi-api
    env_file:
      - ./alrimi-api/.env.local
    environment:
      # env_file 보다 이쪽이 이긴다. 컨테이너 사이에서는 서비스 이름으로 찾으므로
      # 호스트 기준 값(127.0.0.1)이 파일에 있어도 여기서 덮어써야 한다.
      DJANGO_ENV: local
      POSTGRES_DB: ${POSTGRES_DB:-alrimi}
      POSTGRES_USER: ${POSTGRES_USER:-alrimi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alrimi-local}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # 소스를 그대로 물려준다. 저장하면 runserver 가 다시 읽는다.
      - ./alrimi-api:/app
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"

  web:
    build:
      context: ./alrimi-web
      # 개발 서버. 배포 이미지는 --target prod 로 따로 굽는다.
      target: dev
    environment:
      # dev 서버는 매 컴파일마다 환경변수를 읽는다. 빌드 인자로 박을 필요가 없다.
      NEXT_PUBLIC_API_HOST: ${NEXT_PUBLIC_API_HOST:-http://localhost:8000}
      # 파일 변화를 이벤트가 아니라 폴링으로 잡는다. 아래 command 참고.
      # 숫자를 주면 간격(ms)이다: WATCHPACK_POLLING=1000
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-true}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./alrimi-web:/app
      # 호스트 node_modules 는 darwin 바이너리라 리눅스에서 안 돈다. 이미지에
      # 설치된 것을 쓰도록 익명 볼륨으로 가린다. 그래서 의존성을 추가하면
      # `docker compose build web` 으로 이미지를 다시 구워야 한다.
      - /app/node_modules
      # .next 도 컨테이너 것을 쓴다. 호스트의 `npm run dev` 와 같은 자리를 쓰면
      # 서로의 산출물을 밟는다.
      - /app/.next
    depends_on:
      - api
    # 기본 번들러(Turbopack)가 아니라 webpack 으로 띄운다.
    #
    # mac 의 바인드 마운트에서는 호스트의 파일 변경이 컨테이너 안의 inotify 로
    # 전달되지 않는다. 실제로 확인했다 — 컨테이너 안 파일은 바뀌어 있는데
    # Turbopack 은 다시 컴파일하지 않는다. Turbopack 에는 폴링으로 바꾸는 스위치가
    # 없고, webpack 쪽에는 WATCHPACK_POLLING 이 있어서 이쪽을 쓴다.
    #
    # 대신 첫 컴파일이 Turbopack 보다 느리다. 프런트만 만지는 동안에는
    # `docker compose up -d db api` + 호스트의 `npm run dev` 가 여전히 제일 빠르다.
    command: npm run dev -- --webpack

volumes:
  pgdata:
